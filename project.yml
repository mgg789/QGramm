name: QGramm
options:
  minimumXcodeGenVersion: 2.45.0
  xcodeVersion: "26.3"
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.qgramm.ios
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_ASSET_PATHS: "\"QGramm/Resources\""
targets:
  QGramm:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: QGramm
        excludes:
          - Resources
      - path: QGramm/Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QGramm/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
schemes:
  QGramm:
    build:
      targets:
        QGramm: all
    run:
      config: Debug
